<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Doğum Günü Mesajı</title>
</head>
<body style="background-color:#111; color:#fff; text-align:center; padding-top:50px;">
  <h1>🎂 Doğum Günün Kutlu Olsun! 🎉</h1>
  <p>Müzik kutusu için butona tıkla.</p>

  <audio id="myAudio" autoplay muted>
    <source src="dogum_gunu.mp3" type="audio/mpeg">
  </audio>

  <button onclick="playAudio()" style="margin-top: 30px; font-size: 18px; padding: 10px 20px;">🔊 Sesi Aç</button>

  <script>
    function playAudio() {
      const audio = document.getElementById("myAudio");
      audio.muted = false;
      audio.play().catch(err => console.log("Çalma hatası:", err));
    }
  </script>
</body>
</html>
